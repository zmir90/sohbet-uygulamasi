<!DOCTYPE html>
<html>
<head>
    <title>Süper Sohbet v13 (Giriş Sistemi)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css?v=13"> </head>
<body>

    <div id="auth-container">
        <div id="login-form-container">
            <h2>Giriş Yap</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Kullanıcı Adı" required autocomplete="username">
                <input type="password" id="login-password" placeholder="Şifre" required autocomplete="current-password">
                <button type="submit">Giriş Yap</button>
                <p id="login-error" class="error-message"></p>
            </form>
            <p>Hesabın yok mu? <a href="#" id="show-register">Kayıt Ol</a></p>
        </div>

        <div id="register-form-container" style="display: none;">
            <h2>Kayıt Ol</h2>
            <form id="register-form">
                <input type="text" id="register-username" placeholder="Kullanıcı Adı Seç" required autocomplete="username">
                <input type="password" id="register-password" placeholder="Şifre Seç" required autocomplete="new-password">
                <button type="submit">Kayıt Ol</button>
                <p id="register-error" class="error-message"></p>
                <p id="register-success" class="success-message"></p>
            </form>
            <p>Zaten hesabın var mı? <a href="#" id="show-login">Giriş Yap</a></p>
        </div>
    </div>

    <div id="room-selection-container" style="display: none;">
        <h2>Bir Odaya Katıl</h2>
        <form id="room-form">
            <input type="text" id="room-input" placeholder="Oda Adı Girin (örn: genel)" required>
            <button type="submit">Odaya Katıl</button>
        </form>
        <button id="logout-button-room">Çıkış Yap</button> </div>


    <div id="chat-container" style="display: none;">
        <div id="sidebar">
            <button id="logout-button-chat">Çıkış Yap</button>
            <div id="room-display">
                Oda: <span id="room-name">...</span>
            </div>
            <h3>Aktif Kullanıcılar</h3>
            <ul id="user-list"></ul>
        </div>
        <div id="chat-area">
            <button id="menu-toggle">&#9776;</button>
            <ul id="messages"></ul>
            <div id="typing-notification"></div>
            <form id="form" action="">
                <input id="input" placeholder="Mesajınızı yazın..." autocomplete="off" />
                <label for="file-input" id="file-label">📎</label>
                <input type="file" id="file-input" accept="image/*" />
                <button id="send-button">Gönder</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js?v=13"></script> </body>
</html>
