<!DOCTYPE html>
<html>
<head>
    <title>Süper Sohbet v10.5 (Mobil Uyumlu)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div id="login-screen">
        <h2>Sohbete Katıl</h2>
        <form id="login-form" action="">
            <input id="username-input" placeholder="Kullanıcı adınızı girin..." autocomplete="off" />
            <input id="room-input" placeholder="Oda adını girin (örn: genel)" autocomplete="off" />
            <button id="login-button">Katıl</button>
        </form>
    </div>

    <div id="chat-container">

        <div id="sidebar">
            <div id="room-display">
                Oda: <span id="room-name">...</span>
            </div>
            <h3>Aktif Kullanıcılar</h3>
            <ul id="user-list"></ul>
        </div>

        <div id="chat-area">

            <button id="menu-toggle">&#9776;</button>

            <ul id="messages"></ul>
            <div id="typing-notification"></div>

            <form id="form" action="">
                <input id="input" placeholder="Mesajınızı yazın..." autocomplete="off" />
                <label for="file-input" id="file-label">📎</label>
                <input type="file" id="file-input" accept="image/*" />
                <button id="send-button">Gönder</button>
            </form>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>
</html>
